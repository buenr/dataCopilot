[project]
name = "data-copilot"
version = "0.1.0"
description = "Container-native enterprise analytics agent workbench POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "docker>=7.1",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.5",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
providers = [
  "anthropic>=0.39",
  "openai>=1.54",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

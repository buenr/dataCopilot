[project]
name = "data-copilot"
version = "0.1.0"
description = "Container-native enterprise analytics agent workbench POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "docker>=7.1",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.5",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
providers = [
  "anthropic>=0.39",
  "openai>=1.54",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Security heuristics (S) are owned by bandit + semgrep. B008 fires on FastAPI's
# File(...)/Depends(...) default idiom. BLE stays off: the agent loop deliberately
# converts broad exceptions into tool results for the model. E501 stays off: the
# codebase predates the 100-column limit and line length is a formatter concern.
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "PIE", "FURB"]
ignore = ["B008", "E501"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "matplotlib>=3.11.1",
    "reportlab>=5.0.0",
    "ruff>=0.16.2",
    "semgrep>=1.172.0",
    "ty>=0.0.69",
]
